# Terraform Provider CI
name: CI

on:
  pull_request:
    paths-ignore:
      - "README.md"
  push:
    paths-ignore:
      - "README.md"
    branches:
      - main

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: j178/prek-action@v1

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go mod download
      - run: go build -v .

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.8.0-alpha20240216"
          terraform_wrapper: false
      - run: go generate ./...
      - name: Check git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # Run client unit tests (no real Superset needed — uses httpmock).
  test-client:
    name: Client Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go mod download
      - run: go test -v -cover ./internal/client/
        timeout-minutes: 5

  # Acceptance tests against a real Superset instance spun up via docker-compose.
  # Matrix: Superset 6.0 × 6.1, Terraform 1.8.
  test-acc:
    name: Acceptance Tests (Superset ${{ matrix.superset_version }}, Terraform ${{ matrix.terraform }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        superset_version:
          - "6.0.0"
          - "6.1.0"
        terraform:
          - "1.8.*"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - run: go mod download

      # ── Start Superset ──────────────────────────────────────────────────────
      - name: Pull Superset images
        run: |
          docker compose \
            -f docker-compose/docker-compose.yml \
            -p superset-acc \
            pull --quiet
        env:
          SUPERSET_VERSION: ${{ matrix.superset_version }}

      - name: Start Superset ${{ matrix.superset_version }}
        run: |
          docker compose \
            -f docker-compose/docker-compose.yml \
            -p superset-acc \
            up -d --wait
        env:
          SUPERSET_VERSION: ${{ matrix.superset_version }}
          SUPERSET_PORT: "8088"

      - name: Wait for Superset to be healthy
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8088/health; then
              echo "Superset is healthy"
              exit 0
            fi
            echo "Waiting... ($i/40)"
            sleep 5
          done
          echo "Superset did not become healthy in time"
          docker compose -f docker-compose/docker-compose.yml -p superset-acc logs --tail=100
          exit 1

      # ── Run acceptance tests ────────────────────────────────────────────────
      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          SUPERSET_HOST: "http://localhost:8088"
          SUPERSET_USERNAME: "admin"
          SUPERSET_PASSWORD: "admin"
        run: go test -v -cover ./internal/provider/ -timeout 25m
        timeout-minutes: 25

      # ── Cleanup ─────────────────────────────────────────────────────────────
      - name: Stop Superset
        if: always()
        run: |
          docker compose \
            -f docker-compose/docker-compose.yml \
            -p superset-acc \
            down -v --remove-orphans
        env:
          SUPERSET_VERSION: ${{ matrix.superset_version }}
